name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: bash -n bootstrap-afk.sh test/smoke.sh
      - name: Shellcheck (when available)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck bootstrap-afk.sh
          else
            echo "shellcheck not preinstalled; syntax check only"
          fi
