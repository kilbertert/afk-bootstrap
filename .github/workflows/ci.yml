name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    # GitHub-hosted, not the repository runner. This job needs a checkout, node,
    # and a system python — nothing from the host. Running it on a self-hosted
    # runner made the required check depend on a long-lived process on the
    # development machine: when that runner was stopped (2026-10-31, it had been
    # idle for four days) every push and PR sat `queued` until timeout, so the
    # branch looked broken for a reason that had nothing to do with the change.
    #
    # The runner's PATH is what made this look host-specific in the first place:
    # it carries no conda, so `python3` was the Debian system interpreter and the
    # PEP 668 note below applied. On a hosted runner the same caveat holds —
    # `actions/setup-python` is not used, so `python3` is still the image's system
    # interpreter. Keep the flag; it is about the interpreter, not the runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bash syntax check
        run: bash -n bootstrap-afk.sh upgrade-afk.sh test/smoke.sh test/trusted-pr-delivery.sh
      - name: Workflow structure check
        run: |
          # `python3` here is the image's system interpreter (Debian/Ubuntu), not
          # a user Python: this step deliberately does not run
          # `actions/setup-python`, because the check must see the same
          # interpreter a plain `python3` resolves to. That interpreter is PEP 668
          # "externally managed": `pip install --user` refuses with
          # `externally-managed-environment`, and the step fails before
          # `test/workflows.py` ever runs.
          #
          # Measured: this went red on 2026-10-17 with no repository change. The
          # trigger was an unattended security upgrade on 2026-10-15 04:01 that
          # bumped `python3.12` 3.12.3-1ubuntu0.3 -> 3.12.3-1ubuntu0.17, which
          # re-applied the externally-managed patch. The last green run was
          # 2026-10-13 18:03, before it.
          #
          # `--break-system-packages` is the narrow fix and it is not put here
          # to relax a gate: the system Python already ships a PyYAML (6.0.1),
          # so the risk of the flag is theoretical, and `--user` keeps the
          # install out of the system tree. The alternative — dropping the
          # install and reading whatever the host happens to have — would make
          # the pinned version a fiction.
          python3 -m pip install --break-system-packages --disable-pip-version-check --quiet --user PyYAML==6.0.2
          python3 test/workflows.py
      - name: Self-contained scaffold smoke tests
        run: |
          test/smoke.sh node
          test/smoke.sh python
          bash test/trusted-pr-delivery.sh
      # A migration must not write back a file the project took out of version
      # control. The signal is git history, so this test needs a real repository
      # rather than the hand-built fixtures `smoke.sh` uses — `git init` in a
      # temp directory produces a tree with no history to read, which is why the
      # first attempt at this assertion passed for the wrong reason.
      #
      # The repository it clones is this one: afk-bootstrap has no removed
      # REPO-MAP.md, so the test builds the two states by adding a commit.
      # Cloning the canonical checkout from a fresh one is cheap and keeps the
      # test independent of any sibling project's layout.
      - name: A migration honours a project's removed REPO-MAP.md
        # The signal is git history, so the test needs a real project tree. This
        # repository is not one: it ships `.sandcastle/` under `scaffold/` and has
        # no AFK checkout of its own, so `$PWD` fails the precondition immediately.
        # A consumer repository is cloned instead — the test builds both states
        # (removed, tracked) from it and asserts one of each.
        #
        # `AFK_TEST_PROJECT` overrides the source; without it the step is skipped
        # rather than failed, because a fork or an offline runner is not a reason
        # to call this repository broken.
        env:
          AFK_TEST_PROJECT: ${{ vars.AFK_TEST_PROJECT }}
        run: |
          set -euo pipefail
          src="${AFK_TEST_PROJECT:-$RUNNER_TEMP/afk-test-project}"
          if [ -z "${AFK_TEST_PROJECT:-}" ]; then
            # Full history, not --depth: the fixture needs the commit that removed the
            # map, and a shallow clone does not reach it. Measured: --depth 50 fails
            # the fixture's own "no history" precondition, which is the assertion
            # doing its job rather than a flaky test.
            if ! git clone -q https://github.com/kilbertert/AI-Ops "$src" 2>/dev/null; then
              echo "note: could not clone a project tree; skipping (not a failure)"
              exit 0
            fi
          fi
          bash test/repo-map-removal.sh "$src"
      # The scaffolder's own decision records. `afk-bootstrap` is an
      # afk-bootstrap project, so it adopts what it ships — and the records it
      # carries are the ones that explain why the template looks the way it does.
      - name: Verify decision records
        run: node scaffold/.sandcastle/adr.check.mjs --all
      - name: Shellcheck (when available)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck bootstrap-afk.sh upgrade-afk.sh test/smoke.sh test/trusted-pr-delivery.sh scaffold/.sandcastle/trusted-pr-delivery.sh
          else
            echo "shellcheck not preinstalled; syntax check only"
          fi
