name: Architecture Review

on:
  schedule:
    # Monday–Friday, at the hour this project is assigned. GitHub may delay
    # scheduled runs under load.
    #
    # The hour is a `__AFK_CRON_HOUR__` placeholder rather than a literal, and
    # bootstrap renders it per project. It was a hardcoded `9` for every
    # project, which put every project's review on the same minute against a
    # shared upstream key: a run lasts 20–68 minutes (measured), so minute-level
    # offsets cannot separate them and the reviews took a `429 concurrency
    # reached, current: 6, limit: 5` and failed.
    #
    # The value is assigned by hand in `.afk-bootstrap.json` (`cron_hour`) and
    # is deliberately NOT derived from the project slug: a hash collides (two
    # of this fleet's five slugs collide in a six-hour window), and a silent
    # collision is the same defect this placeholder exists to remove.
    - cron: "0 __AFK_CRON_HOUR__ * * 1-5"
  workflow_dispatch:

jobs:
  check-backlog:
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      issues: read
    outputs:
      proceed: ${{ steps.count.outputs.proceed }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AFK_AGENT_GH_TOKEN: ${{ secrets.AFK_AGENT_READ_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Count open architecture-review issues
        id: count
        env:
          LABEL: source:architecture-review
        run: |
          set -euo pipefail
          # Only care whether the backlog is below 10, so a limit of 10 is enough
          # to detect the threshold; the true count may be higher.
          open=$(gh issue list --state open --label "$LABEL" --limit 10 --json number --jq 'length')
          echo "Found $open open '$LABEL' issue(s) (counted up to 10)."
          if [ "$open" -lt 10 ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Backlog has 10+ open '$LABEL' issues — skipping this run." >> "$GITHUB_STEP_SUMMARY"
          fi

  architecture-review:
    needs: check-backlog
    if: needs.check-backlog.outputs.proceed == 'true'
    runs-on: self-hosted
    # Sized against observed runs, not guessed. A real review took 19m13s
    # against the previous 20m budget, so the job was cancelled inside its own
    # success path — after the PRD was published, while the post step uploaded
    # the npm cache — and reported a `cancelled` that reads as failure. 45m
    # gives ~2.3x the observed review time for a slower day, and sits below the
    # 60m the other agent workflows budget rather than an order below them.
    #
    # Measured across projects: three of them hit the old 20m wall repeatedly
    # (durations of 20.7, 20.8, 22.0, 22.1, 23.2 minutes, all `cancelled`),
    # which is the timeout firing, not the model failing. Raise this from
    # evidence, never from optimism — the number above is a measurement.
    timeout-minutes: 45
    concurrency:
      group: architecture-review
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AFK_AGENT_GH_TOKEN: ${{ secrets.AFK_AGENT_READ_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout main with runner HOME and managed Git hooks
        run: |
          set -euo pipefail
          gh auth setup-git
          if [ -d .git ]; then
            git remote remove origin 2>/dev/null || true
            git remote add origin "https://github.com/${GH_REPO}.git"
            # Stale-runner safety: discard local tracked + untracked leftovers.
            git reset --hard HEAD 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            git fetch --depth 1 origin main
            git checkout -B main FETCH_HEAD
            git branch --list 'agent/*' 'sandcastle/*' | xargs -r git branch -D 2>/dev/null || true
          else
            git clone --branch main --depth 1 "https://github.com/${GH_REPO}.git" .
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run architecture-review.ts
        env:
          AFK_PROFILE: ${{ vars.AFK_PROFILE || 'claude-stepfun' }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: npm exec tsx .sandcastle/architecture-review/architecture-review.ts

      - name: Publish PRD issue
        id: publish
        env:
          OUTPUT_FILE: ${{ runner.temp }}/architecture_review_output.json
          TITLE_FILE: ${{ runner.temp }}/prd_title.txt
          BODY_FILE: ${{ runner.temp }}/prd_body.md
          LABEL: source:architecture-review
        run: |
          set -euo pipefail
          status=$(jq -r '.status' "$OUTPUT_FILE")
          if [ "$status" != "proposed" ]; then
            echo "Status is '$status' — nothing to publish."
            exit 0
          fi
          title=$(cat "$TITLE_FILE")
          # Ensure the provenance label exists (idempotent — succeeds if already present).
          gh label create "$LABEL" \
            --color "5319E7" \
            --description "PRDs proposed by the automated architecture-review workflow" \
            >/dev/null 2>&1 || true
          # gh issue create prints the URL on the last line.
          issue_url=$(gh issue create \
            --title "$title" \
            --body-file "$BODY_FILE" \
            --label "$LABEL" | tail -n1)
          issue_number=$(basename "$issue_url")
          echo "issue_url=$issue_url" >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "Published #${issue_number}: ${issue_url}"

      - name: Summarise run
        if: always()
        env:
          OUTPUT_FILE: ${{ runner.temp }}/architecture_review_output.json
        run: |
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "No output file produced — agent likely crashed before emitting a result."
            exit 0
          fi
          status=$(jq -r '.status' "$OUTPUT_FILE")
          {
            echo "## Architecture review"
            echo ""
            if [ "$status" = "proposed" ]; then
              issue_url="${{ steps.publish.outputs.issue_url }}"
              title=$(jq -r '.title' "$OUTPUT_FILE")
              summary=$(jq -r '.oneLineSummary' "$OUTPUT_FILE")
              echo "**Created:** [$title]($issue_url)"
              echo ""
              echo "$summary"
              echo ""
              echo "### Candidates considered"
              jq -r '.candidatesConsidered[] | "- \(.)"' "$OUTPUT_FILE"
            elif [ "$status" = "skipped" ]; then
              reason=$(jq -r '.reason' "$OUTPUT_FILE")
              echo "**Skipped — no fresh candidates today.**"
              echo ""
              echo "$reason"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
