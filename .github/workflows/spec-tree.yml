name: Spec Tree

# The `.spec/` tree is project source, and its drift rule is computed from git
# history on every read. Two consequences decide this workflow's shape:
#
#   * `fetch-depth: 0` is REQUIRED, not an optimisation. Measured on a real
#     depth-1 clone: lint reported `0 error 0 warning` after an anchored unit had
#     been modified. A check that passes when it should fail is worse than no
#     check at all.
#   * the version is PINNED. The tree format is committed to this repository, so
#     an unpinned CLI could change the format underneath it.
#
# This repository is itself an afk-bootstrap project, so this job follows the
# same shape as the scaffolder's own `ci.yml`: the repository runner, pinned
# actions, read-only permissions. It needs nothing but a checkout and node.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-tree-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: spec-tree lint
    # GitHub-hosted: the job needs a checkout, node, and one npm-installed CLI.
    # It previously used the repository runner, which put a required check behind
    # a long-lived host process; stopping that runner (2026-10-31) would have left
    # every PR queued until timeout.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the pinned spec CLI
        run: npm install --global spexcode@0.7.0

      - name: Lint the spec tree
        run: spex spec lint
